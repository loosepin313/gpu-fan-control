# /etc/gpu-fan-control.conf - sourced by /usr/local/bin/gpu-fan-control.sh
#
# Worked example: passively cooled AMD Instinct MI50 in a MACHINIST X99 G7
# chassis, one 120mm case fan on the header the board prints as "FAN3".
# Every value below was measured, not guessed - see tools/calibrate_fan.sh.
# Adapt the hardware block for your board; the control block is what the
# measurements led to.

# --- hardware selection ----------------------------------------------------
GPU_PCI="0000:04:00.0"
GPU_HWMON_NAME="amdgpu"
FAN_HWMON_NAME="nct6779"

# Board FAN3 header = Super I/O chip channel 1. The silkscreen does NOT match
# the chip's channel numbering; verified by sweeping every channel and watching
# fan*_input with fan_probe.sh. Channels 3, 4 and 5 are dead headers on this
# board. Get this wrong and the control loop writes to a dead header while
# looking completely healthy.
PWM_CHANNEL=1

# --- control mode ----------------------------------------------------------
# proportional ramps the fan across a temperature band instead of slamming
# between two fixed speeds. step = the original v1 two-position behaviour.
CONTROL_MODE="proportional"

# Control on JUNCTION, not edge. Junction is the hotspot and the sensor that
# runs away first: at duty 90 edge sat at 60C while junction was at 91C.
# Capping junction keeps edge and mem well under the same number.
GPU_TEMP_LABEL="junction"

# --- the ceiling -----------------------------------------------------------
# At/above this the fan goes to 255 and stays there until the sensor falls
# CEILING_HYSTERESIS back down, so a reading hovering on the limit cannot flap
# the fan between two extremes every poll.
CEILING_TEMP=80
CEILING_HYSTERESIS=6

# --- proportional band -----------------------------------------------------
# MAX_PWM is reached at 74C, i.e. 6C BEFORE the ceiling. The card has real
# thermal lag - junction kept rising for ~20 s after the load stopped (84 ->
# 92C) - so the fan must already be at full effort before the ceiling is hit,
# not waiting until it is reached.
TEMP_THRESHOLD_LOW=55      # junction C at or below which the fan idles
TEMP_THRESHOLD_HIGH=74     # junction C at or above which MAX_PWM applies
MIN_PWM=60                 # 23% -> ~1660 RPM. Quiet, and keeps air moving over
                           # the passively cooled MI50 heatsink. Idle junction
                           # is ~30C so the fan normally sits here.
MAX_PWM=220                # 86% -> ~4700 RPM. Duty 200 and duty 255 measured
                           # within 4C of each other, so the last 35 units are
                           # noise rather than cooling. The ceiling override
                           # still goes to 255 if junction reaches 80C.

# --- proportional behaviour ------------------------------------------------
TEMP_AVG_N=3               # samples averaged; damps transient spikes
PWM_STEP=5                 # only rewrite the duty when it moves by this much
POLL_INTERVAL=10

# --- mirror mode window (unused while CONTROL_MODE=proportional) -----------
# The amdgpu driver does compute a fan demand for this passive card even though
# there is no fan fitted, and it does track temperature - but it only ever asks
# for 37..63 out of 255 (14%..24%), a window sized for the small fan the card
# does not have. Mirror mode rescales that onto MIN_PWM..MAX_PWM. Measured,
# mirror mode settles around 83-85C on this box, so it is not the primary law
# here - but it is a decent shape if you want the card's own curve to set it.
GPU_PWM_LOW=37
GPU_PWM_HIGH=63

# --- safety ----------------------------------------------------------------
# Left empty on purpose: the MI50 is passively cooled and relies on chassis
# airflow, so the fan should never fully stop.
FAN_OFF_BELOW_C=""
FAILSAFE_AFTER=3
PWM_MODE=""

# --- power cap (required to honour the 80C ceiling on this box) ------------
# Measured thermal resistance at duty 255 is 0.262 C/W. From the card's ~30C
# idle junction that means the fan can only ever hold about
#   (80 - 30) / 0.262 = 190 W
# and no more. Verified under load: with three concurrent inference streams
# (~190-240 W) the fan sat at duty 255 / 5200 RPM and junction still held
# 80-86C. Airflow was no longer the constraint - heat input was.
#
# Capping at 180 W predicts junction <= 77C at duty 255 and puts the ceiling
# back inside the fan's capability. Measured result with the cap in place:
# peak junction 76C, zero samples over 80C, and the fan never reached full
# blast. Raise it (or comment it out) if you want the last ~10-20% of inference
# throughput back and accept junction in the high 80s under full concurrency.
GPU_POWER_LIMIT_W=180
