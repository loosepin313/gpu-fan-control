# /etc/gpu-fan-control.conf - sourced by /usr/local/bin/gpu-fan-control.sh
#
# Worked example: passively cooled AMD Instinct MI50 in a MACHINIST X99 G7
# chassis, one 120mm case fan on the header the board prints as "FAN3".
# Every value below was measured, not guessed - see tools/calibrate_fan.sh.
# Adapt the hardware block for your board; the control block is what the
# measurements led to.

# --- hardware selection ----------------------------------------------------
GPU_PCI="0000:04:00.0"
GPU_HWMON_NAME="amdgpu"
FAN_HWMON_NAME="nct6779"

# Board FAN3 header = Super I/O chip channel 1. The silkscreen does NOT match
# the chip's channel numbering; verified by sweeping every channel and watching
# fan*_input with fan_probe.sh. Channels 3, 4 and 5 are dead headers on this
# board. Get this wrong and the control loop writes to a dead header while
# looking completely healthy.
PWM_CHANNEL=1

# --- control mode ----------------------------------------------------------
# proportional ramps the fan across a temperature band instead of slamming
# between two fixed speeds. step = the original v1 two-position behaviour.
CONTROL_MODE="proportional"

# Control on JUNCTION, not edge. Junction is the hotspot and the sensor that
# runs away first: at duty 90 edge sat at 60C while junction was at 91C.
# Capping junction keeps edge and mem well under the same number.
GPU_TEMP_LABEL="junction"

# --- the ceiling -----------------------------------------------------------
# This is an EMERGENCY brake, not the operating target. AMD's guidance for the
# MI50 puts ideal junction under load at 85-100C, with junction critical
# around 100C and throttling above that. Sitting the fan at 74C to chase an
# 80C ceiling was burning a lot of acoustic budget for no reliability gain.
# 95C is far above anything the proportional law allows in normal operation, so
# it should essentially never trip - it exists for a detached fan, a blocked
# heatsink or a sensor lying to us.
# At/above this the fan goes to 255 and stays there until the sensor falls
# CEILING_HYSTERESIS back down, so a reading hovering on the limit cannot flap
# the fan between two extremes every poll.
CEILING_TEMP=95
CEILING_HYSTERESIS=6

# --- proportional band -----------------------------------------------------
# Sized from the measured duty -> temperature table. At the 180W cap, duty 180
# holds junction ~87C at the 192W peaks while duty 220 holds ~84C: 600 RPM for
# 3C. The band is also much wider than v2's (28C vs 19C), which nearly halves
# the loop gain - that is what "ramps up too fast" actually was.
#   old: band 55->74, duty 60..220  = 8.4 duty/C, idle 1664 RPM, max 4671 RPM
#   new: band 58->86, duty 50..180  = 4.6 duty/C, idle 1370 RPM, max 4078 RPM
TEMP_THRESHOLD_LOW=58      # junction C at or below which the fan idles
TEMP_THRESHOLD_HIGH=86     # junction C at or above which MAX_PWM applies
MIN_PWM=50                 # 19% -> ~1370 RPM. Audible-quiet, still moves air
                           # over the passively cooled MI50 heatsink. Idle
                           # junction is ~30-45C so the fan normally sits here.
MAX_PWM=180                # 71% -> ~4078 RPM. Predicted to hold junction
                           # ~79C at the 165W average and ~87C at the 192W
                           # peaks - inside the card's 85-100C ideal band, and
                           # comfortably under the 95C emergency ceiling.

# --- proportional behaviour ------------------------------------------------
TEMP_AVG_N=4               # samples averaged; damps transient spikes
PWM_STEP=4                 # smaller steps = smoother ramp, less noticeable
POLL_INTERVAL=10

# --- mirror mode window (unused while CONTROL_MODE=proportional) -----------
# The amdgpu driver does compute a fan demand for this passive card even though
# there is no fan fitted, and it does track temperature - but it only ever asks
# for 37..63 out of 255 (14%..24%), a window sized for the small fan the card
# does not have. Mirror mode rescales that onto MIN_PWM..MAX_PWM. Measured,
# mirror mode settles around 83-85C on this box, so it is not the primary law
# here - but it is a decent shape if you want the card's own curve to set it.
GPU_PWM_LOW=37
GPU_PWM_HIGH=63

# --- safety ----------------------------------------------------------------
# Left empty on purpose: the MI50 is passively cooled and relies on chassis
# airflow, so the fan should never fully stop.
FAN_OFF_BELOW_C=""
FAILSAFE_AFTER=3
PWM_MODE=""

# --- power cap (this is what buys the quiet) -------------------------------
# Measured thermal resistance at duty 255 is 0.262 C/W. From the card's ~30C
# idle junction, full blast can only ever remove about
#   (95 - 30) / 0.262 = 248 W
# so an 80C junction ceiling at the stock 225W cap was never reachable by
# airflow alone - the override fired at duty 255 / 5200 RPM and junction still
# held 80-86C.
#
# Uncapped at 225W, holding junction under 95C needs duty ~255 (5200 RPM) -
# loud. Capped at 180W, duty 180 (4078 RPM) is enough. The cap is not
# protecting the card here, it is what keeps the fan off its top end: the card
# never has to ask for more airflow than a mid-range duty can deliver.
# Raise it toward 225 if you want the throughput back and accept the fan
# running near full blast under sustained concurrency.
GPU_POWER_LIMIT_W=180
